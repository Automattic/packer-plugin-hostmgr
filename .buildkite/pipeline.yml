# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

steps:
  - label: "[DO NOT MERGE] Assert Ruby 3.4.13 on the release path"
    command: |
      set -o pipefail
      docker run --rm ruby:$(cat .ruby-version) ruby -v | tee ruby-v.log
      grep -F 'ruby 3.4.13 ' ruby-v.log
      # Runs the real release target; a missing token aborts before any GitHub call.
      if env -u GITHUB_TOKEN make publish VERSION=0.0.0-validation 2>&1 | tee publish.log; then
        echo "publish unexpectedly succeeded"; exit 1
      fi
      grep -F 'No GitHub Token present in environment' publish.log

  #######
  - label: ":golang: Build for {{ matrix.platform }} on {{ matrix.arch }}"
    key: build
    command: |
      docker run \
      -v $(pwd):/usr/src/plugin \
      -v $(pwd)/.build:/go \
      -w /usr/src/plugin \
      -e GOOS={{ matrix.platform }} \
      -e GOARCH={{ matrix.arch }} \
      golang:1.20 go build -buildvcs=false
    matrix:
      setup:
        platform:
          - darwin
        arch:
          - amd64
          - arm64
    artifact_paths:
      - "packer-plugin-hostmgr"

  - label: ":golang: Lint"
    key: lint
    command: make lint

  - label: ":ruby: Ruby Lint"
    key: lint-ruby
    command: make lint-ruby

  - label: ":github: Release Build"
    key: "gem-push"
    if: build.tag != null
    depends_on:
     - build
     - lint
     - lint-ruby
    command: |
      make package VERSION=${BUILDKITE_TAG}
      make publish VERSION=${BUILDKITE_TAG}
    artifact_paths:
      - "packer-plugin-hostmgr*"
